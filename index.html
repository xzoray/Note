<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notizblock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="init()">
    <header>
        <h1>Notes</h1>
    </header>
    <main>
        <div class="inputSection">
            <input class="insertField" id="titleInput" type="text" placeholder="Title, please?" value="">
            <input class="insertField" id="noteInput" type="text" placeholder="What`s to do?" value="">
            <button class="saveButton" onclick="addNote()">SAVE</button>
        </div>
        <h2 class="noteHeadline">Your Notes:</h2>
        <div id="content"></div>
        <h2 class="trashHeadline">Trash:</h2>
        <div id="trashContent"></div>
    </main>
    <footer>

    </footer>
</body>
 <script src="main.js"></script>
</html>
